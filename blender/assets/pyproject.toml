# ruff settings for Blender 5.2.2 LTS scripts (bundled Python 3.13). No package metadata.
[tool.ruff]
target-version = "py313"
line-length = 100
# Keeps parts/ and geometry/ first-party for isort even under nested architecture/*/ruff.toml.
src = ["."]
# Option templates; their extend paths only resolve after copying (README「アーキテクチャ」).
extend-exclude = ["architecture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]
