# Architecture: load-mutate-save (rust/web-game). Copy this directory to architecture/ at the project
# root; scripts/check-architecture.sh (deps stage of scripts/check.sh) reads it.
# <crate> uses <workspace crates>: the only workspace crates it may depend on directly.
# <crate> never <crates>: must not appear anywhere in its normal/build dependency tree.
# Every workspace member needs a `uses` line (empty = no workspace dependency).
model uses
model never tokio async-std smol mio axum hyper tower tower-http reqwest sqlx redis tungstenite tokio-tungstenite quinn
store uses model
store never axum
usecase uses model store
usecase never axum
api uses model usecase
