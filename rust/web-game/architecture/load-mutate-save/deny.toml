# Architecture: load-mutate-save (rust/web-game). A second cargo-deny pass run by
# scripts/check-architecture.sh: `cargo deny --offline --config architecture/deny.toml check bans`.
# wrappers = the only crates that may depend on the crate directly. Every other rule stays in
# the root deny.toml. Add companion crates that wrap these (e.g. axum-extra) to `wrappers`.
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "axum", wrappers = ["api"], reason = "handlers live only in api" },
    { crate = "sqlx", wrappers = ["store"], reason = "SQL lives only in store" },
    { crate = "redis", wrappers = ["store"], reason = "external stores live only in store" },
]
