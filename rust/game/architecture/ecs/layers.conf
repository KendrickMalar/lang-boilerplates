# Architecture: ecs (rust/game). Copy this directory to architecture/ at the project
# root; scripts/check-architecture.sh (deps stage of scripts/check.sh) reads it.
# <crate> uses <workspace crates>: the only workspace crates it may depend on directly.
# <crate> never <crates>: must not appear anywhere in its normal/build dependency tree.
# Every workspace member needs a `uses` line (empty = no workspace dependency).
sim uses
sim never tokio async-std smol mio axum hyper tower tower-http reqwest sqlx redis tungstenite tokio-tungstenite quinn
room uses sim
room never axum hyper sqlx redis reqwest
gateway uses sim room
gateway never sqlx redis
store uses sim
store never axum
server uses sim room gateway store
