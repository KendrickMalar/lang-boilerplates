[package]
name = "native-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
name = "native_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "native-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.12.2" }

[build-dependencies]
tauri-build = { version = "=2.7.1" }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"

# Individually selected; check.sh/check.ps1 reject warnings with -D warnings.
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
