# Architecture: hexagonal (rust/web). A second cargo-deny pass run by
# scripts/check-architecture.sh: `cargo deny --offline --config architecture/deny.toml check bans`.
# wrappers = the only crates that may depend on the crate directly. Every other rule stays in
# the root deny.toml. Add companion crates that wrap these (e.g. axum-extra) to `wrappers`.
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "axum", wrappers = ["api", "server"], reason = "HTTP is handled only in api (and served by server)" },
    { crate = "sqlx", wrappers = ["infra"], reason = "database access lives only in infra" },
    { crate = "redis", wrappers = ["infra"], reason = "external stores live only in infra" },
    { crate = "reqwest", wrappers = ["infra"], reason = "outbound HTTP lives only in infra" },
]
