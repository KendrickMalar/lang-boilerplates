# Architecture: hexagonal (rust/web). Copy this directory to architecture/ at the project
# root; scripts/check-architecture.sh (deps stage of scripts/check.sh) reads it.
# <crate> uses <workspace crates>: the only workspace crates it may depend on directly.
# <crate> never <crates>: must not appear anywhere in its normal/build dependency tree.
# Every workspace member needs a `uses` line (empty = no workspace dependency).
domain uses
domain never tokio async-std smol mio axum hyper tower tower-http reqwest sqlx redis tungstenite tokio-tungstenite quinn
app uses domain
app never axum hyper sqlx reqwest redis
infra uses domain app
api uses domain app
api never sqlx redis
server uses domain app infra api
